# pnpm build-script approvals (pnpm 11 reads these only from here, not
# package.json's `pnpm` field, `.npmrc`, or v10's `onlyBuiltDependencies`).
# esbuild ships a native binary and needs its postinstall to run.
allowBuilds:
  esbuild: true

# Supply-chain soak: refuse any package version younger than 7 days (10080 min).
# Deliberately stricter than pnpm 11's 1440-minute default, and deliberately NOT
# redundant with dependabot.yml's 7-day cooldown: the cooldown governs only what
# Dependabot *proposes* (direct deps), while this governs everything a resolution
# *installs*. Transitive packages reach the lockfile without Dependabot ever seeing
# them -- apple-mail-mcp carried a 5-day-old transitive ip-address@10.5.0 under the
# 1440 default, which this value rejects. See https://pnpm.io/supply-chain-security.
#
# Cost of the stricter value, stated here so it is not rediscovered painfully: an
# urgent upstream fix cannot be installed until it is 7 days old. There is no
# minimumReleaseAgeExclude carve-out; if one is ever needed, add it narrowly and
# remove it once the version ages past the cutoff.
minimumReleaseAge: 10080

# The MCP SDK currently caps these transitive dependencies below their first
# fully patched releases. Keep the overrides until the SDK's ranges move past
# these security fixes.
overrides:
  "@hono/node-server": 2.0.10
  # GHSA-mh99-v99m-4gvg / CVE-2026-14257 (high): unbounded brace expansion.
  # Dev toolchain only -- brace-expansion is not in the shipped bundle -- but
  # three separate majors are reachable here (eslint -> minimatch@3 -> v1,
  # minimatch@9 -> v2, minimatch@10 -> v5), so each is floored independently
  # on its own complete release.
  #
  # The advisory's first-patched versions (1.1.17 / 2.1.3 / 5.0.8) are NOT
  # sufficient: they bound the accumulator in combine() but never thread
  # maxLength into expandSequence(), leaving the sequence path ({1..N},
  # {a..z..k}) capped only by item count. 1.1.18 / 2.1.4 / 5.0.9 add it.
  #
  # The bounds must be two-sided. A bare "<5.0.9" also matches 1.1.18 and
  # 2.1.4 under semver, and would force minimatch 3's CommonJS path onto the
  # v5 ESM API ("expand is not a function").
  "brace-expansion@>=1.0.0 <1.1.18": 1.1.18
  "brace-expansion@>=2.0.0 <2.1.4": 2.1.4
  "brace-expansion@>=5.0.0 <5.0.9": 5.0.9
  # GHSA-7p8r-x3mc-p8w7 (high): fast-uri URI parsing. Patched in 3.1.5.
  # In the SHIPPED bundle -- ajv (via @modelcontextprotocol/sdk) pulls it and
  # esbuild inlines it into build/index.js -- so this one is load-bearing.
  #
  # Write every floor as a CARET RANGE, never an exact pin. This entry used to
  # read `fast-uri: 3.1.4` (the pre-fix "security floor"), which silently
  # became a CEILING the moment 3.1.5 shipped and held the tree on the
  # vulnerable version. A caret stays inside ajv's expected major while
  # letting patch fixes flow in.
  fast-uri: ^3.1.5
  # GHSA-mwp4-54f8-5fhr (high), plus GHSA-4xrf-jv44-h6hh and
  # GHSA-22jq-vg5j-6vgg. Patched in 10.3.1; express-rate-limit (via
  # @modelcontextprotocol/sdk) caps it at 10.2.0. Not in the shipped bundle
  # (the HTTP transports are tree-shaken out of the stdio server), so this is
  # install-tree hygiene rather than a runtime exposure.
  ip-address: ^10.3.1
  # GHSA-8j4g-w8fx-2239 (moderate): ReDoS in Hono's CORS middleware, fixed in
  # 4.12.34. Deferred earlier the same day because that release was still inside
  # the 1440-minute minimumReleaseAge soak declared above — it missed by under
  # three minutes. It matured at 2026-08-04T02:36:40Z and is floored here now.
  # No minimumReleaseAgeExclude carve-out was ever added; the soak is deliberate.
  # Reached via @modelcontextprotocol/sdk -> @hono/node-server; not in the
  # shipped build/index.js bundle, so the exposure was supply-chain only.
  hono: ^4.12.34
  # GHSA-5p4m-2wfm-xmqj (high): quadratic CPU consumption resolving !!omap,
  # fixed in 4.3.1 — the CVE-2026-59870 fix was never backported to the 3.x line.
  # Reached as eslint -> js-yaml, so development scope, and absent from the
  # shipped build/index.js bundle: nothing vulnerable was ever published. Floored
  # as a caret range, never an exact pin, for the reason recorded on fast-uri above.
  js-yaml: ^4.3.1
